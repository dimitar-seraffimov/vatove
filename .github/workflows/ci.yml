name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: uv sync --all-packages --dev --locked
      - run: uv run ruff check services/worker
      - run: uv run pytest

